<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex items-center justify-center h-screen">

    <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-2xl w-96">
        <h1 class="text-xl font-bold mb-4 text-cyan-400 text-center">Secure Portal</h1>
        <p class="text-sm text-slate-400 mb-6 text-center">Enter data below to dispatch it instantly.</p>

        <div class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Payload Data</label>
                <input type="text" id="userInput" placeholder="Type something..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-cyan-400">
            </div>
            
            <button onclick="sendData()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-2.5 rounded-lg transition">
                Send to Telegram
            </button>
            
            <div id="statusMsg" class="text-xs text-center text-slate-400 mt-2"></div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8114361873:AAFmtl8vD0Vo7CZvkVmwnjcZZxtzvZXqguY";
        const CHAT_ID = "5022620385";

        async function sendData() {
            const input = document.getElementById('userInput');
            const status = document.getElementById('statusMsg');
            const text = input.value.trim();

            if (!text) {
                status.innerText = "Please enter some text first.";
                status.className = "text-xs text-center text-red-400 mt-2";
                return;
            }

            status.innerText = "Sending...";
            status.className = "text-xs text-center text-yellow-400 mt-2";

            try {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: `Web Portal Log: ${text}`
                    })
                });

                if (response.ok) {
                    status.innerText = "Dispatched successfully!";
                    status.className = "text-xs text-center text-green-400 mt-2";
                    input.value = "";
                } else {
                    status.innerText = "Failed to send payload.";
                    status.className = "text-xs text-center text-red-400 mt-2";
                }
            } catch (error) {
                status.innerText = "Network error occurred.";
                status.className = "text-xs text-center text-red-400 mt-2";
            }
        }
    </script>
</body>
</html>
