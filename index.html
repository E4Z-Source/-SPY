<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Security Camera Intelligence Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
            <h1 class="text-lg font-bold tracking-wide text-cyan-400">Security Camera Radar</h1>
        </div>
        <div class="text-xs text-slate-400">Sector: <span class="text-white font-medium">Mosul, Iraq</span></div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar Controls & Camera Specs -->
        <aside class="w-full md:w-96 bg-slate-800 border-r border-slate-700 flex flex-col p-4 overflow-y-auto">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-2">Proximity Filter</h2>
            
            <!-- Range Slider Box -->
            <div class="bg-slate-700/50 p-3 rounded-lg border border-slate-600 mb-4 shadow-inner">
                <div class="flex justify-between items-center mb-1">
                    <label for="rangeSlider" class="text-xs text-slate-300">Search Radius</label>
                    <span class="text-xs font-bold text-cyan-400"><span id="rangeValue">5</span> km</span>
                </div>
                <input type="range" id="rangeSlider" min="1" max="25" value="5" class="w-full accent-cyan-400 cursor-pointer">
            </div>

            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Detected Feeds</h2>
                <span id="counterBadge" class="text-xs bg-cyan-900 text-cyan-300 px-2 py-0.5 rounded-full font-bold">0 Active</span>
            </div>
            
            <!-- Camera Feed Cards Container -->
            <div id="cameraList" class="space-y-3 flex-1 overflow-y-auto pr-1">
                <!-- Populated dynamically via JS -->
            </div>
        </aside>

        <!-- Interactive Map Panel -->
        <main class="flex-1 relative">
            <div id="map" class="w-full h-full z-0"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered around Mosul Center
        const centerCoords = [36.3400, 43.1300];
        const map = L.map('map').setView(centerCoords, 13);

        // Dark tactical map tile layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap & CARTO',
            maxZoom: 19
        }).addTo(map);

        // User Position Marker
        L.circleMarker(centerCoords, {
            radius: 7,
            color: '#38bdf8',
            fillColor: '#38bdf8',
            fillOpacity: 1
        }).addTo(map).bindPopup("<b>Reference Node (You)</b>");

        // Comprehensive Database of Local Camera Nodes with Specifications
        const cameras = [
            { id: 1, name: "Al-Nuri Square Junction", type: "PTZ Dome (IP66)", resolution: "4K UHD (8MP)", ip: "192.168.1.104", status: "Online", lat: 36.3445, lng: 43.1320, url: "#" },
            { id: 2, name: "Mosul University Bridge", type: "Fixed Bullet IR", resolution: "1080p Full HD", ip: "10.0.4.52", status: "Online", lat: 36.3620, lng: 43.1150, url: "#" },
            { id: 3, name: "Ninawa Commercial Street", type: "Thermal & Optical Bi-Spectrum", resolution: "4MP Starlight", ip: "192.168.8.15", status: "Online", lat: 36.3320, lng: 43.1450, url: "#" },
            { id: 4, name: "Al-Jazeera Park Main Gate", type: "360° Fisheye Panoramic", resolution: "12MP Ultra-Wide", ip: "10.50.2.11", status: "Standby", lat: 36.3250, lng: 43.1200, url: "#" },
            { id: 5, name: "Industrial Zone North Sector", type: "Heavy-Duty Explosion Proof PTZ", resolution: "4K Motorized Zoom", ip: "192.168.100.4", status: "Online", lat: 36.3800, lng: 43.1000, url: "#" },
            { id: 6, name: "Bab Al-Toub Intersection", type: "Standard Bullet Cam", resolution: "720p HD", ip: "10.0.1.88", status: "Online", lat: 36.3350, lng: 43.1380, url: "#" }
        ];

        let markers = [];
        let searchRadiusCircle = null;

        // Haversine formula for distance calculation in kilometers
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        // Core render and filter loop
        function updateDashboard() {
            const maxRange = parseFloat(document.getElementById('rangeSlider').value);
            document.getElementById('rangeValue').innerText = maxRange;

            // Clear previous map markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            if (searchRadiusCircle) {
                map.removeLayer(searchRadiusCircle);
            }

            // Draw range boundary circle on map
            searchRadiusCircle = L.circle(centerCoords, {
                radius: maxRange * 1000,
                color: '#06b6d4',
                fillColor: '#06b6d4',
                fillOpacity: 0.05,
                weight: 1,
                dashArray: '4, 4'
            }).addTo(map);

            const listContainer = document.getElementById('cameraList');
            listContainer.innerHTML = '';

            let activeCount = 0;

            cameras.forEach(cam => {
                const distance = getDistance(centerCoords[0], centerCoords[1], cam.lat, cam.lng);

                if (distance <= maxRange) {
                    activeCount++;

                    // Custom map marker popup content
                    const popupContent = `
                        <div class="p-1 text-slate-900">
                            <b class="text-base">${cam.name}</b><br>
                            <span class="text-xs bg-slate-200 px-1.5 py-0.5 rounded font-mono">${cam.type}</span><br>
                            <span class="text-xs text-slate-600">Res: ${cam.resolution} | IP: ${cam.ip}</span><br>
                            <span class="text-xs font-semibold text-cyan-700">Distance: ${distance.toFixed(1)} km</span>
                        </div>
                    `;

                    const marker = L.marker([cam.lat, cam.lng]).addTo(map).bindPopup(popupContent);
                    markers.push(marker);

                    // Build Sidebar Card with Full Technical Specifications
                    const card = document.createElement('div');
                    card.className = "bg-slate-700/60 border border-slate-600 p-3 rounded-lg hover:border-cyan-400 transition cursor-pointer";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <span class="font-semibold text-slate-100 text-sm">${cam.name}</span>
                            <span class="text-[10px] bg-emerald-900 text-emerald-300 px-1.5 py-0.5 rounded">${cam.status}</span>
                        </div>
                        <div class="mt-2 text-xs space-y-1 text-slate-300 font-mono">
                            <div><span class="text-slate-400">Type:</span> ${cam.type}</div>
                            <div><span class="text-slate-400">Resolution:</span> ${cam.resolution}</div>
                            <div><span class="text-slate-400">Node IP:</span> ${cam.ip}</div>
                        </div>
                        <div class="mt-3 flex justify-between items-center pt-2 border-t border-slate-600/50">
                            <span class="text-xs text-cyan-400 font-medium">${distance.toFixed(1)} km away</span>
                            <button onclick="focusCamera(${cam.lat}, ${cam.lng})" class="text-xs bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold px-2 py-1 rounded transition">Locate on Map</button>
                        </div>
                    `;
                    listContainer.appendChild(card);
                }
            });

            document.getElementById('counterBadge').innerText = `${activeCount} Active`;

            if (activeCount === 0) {
                listContainer.innerHTML = `<div class="text-slate-400 text-xs text-center py-8">No camera feeds found within this range boundary. Expand the slider above.</div>`;
            }
        }

        function focusCamera(lat, lng) {
            map.setView([lat, lng], 16);
        }

        // Bind range slider action
        document.getElementById('rangeSlider').addEventListener('input', updateDashboard);

        // Initial trigger
        updateDashboard();
    </script>
</body>
</html>
