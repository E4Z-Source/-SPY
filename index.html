<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Satellite Surveillance Intelligence - Mosul Grid</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #020617; color: #f8fafc; overflow: hidden; }
        #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        @media (min-width: 768px) { #app-container { flex-direction: row; } }
        #map { width: 100%; height: 50vh; flex: 1; z-index: 1; }
        @media (min-width: 768px) { #map { height: 100%; } }
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- Sidebar Controls & Camera Directory -->
        <aside class="w-full md:w-[480px] bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col p-4 z-25 shrink-0 h-[50vh] md:h-full">
            
            <!-- Top Header -->
            <div class="flex justify-between items-center mb-3 pb-3 border-b border-slate-800 shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
                    <h1 class="text-sm font-bold tracking-wider text-cyan-400 uppercase">Mosul Orbital Surveillance Grid</h1>
                </div>
                <span class="bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-0.5 rounded font-mono text-xs font-bold" id="activeCountBadge">0 Nodes</span>
            </div>

            <!-- Controls Panel -->
            <div class="space-y-3 mb-3 shrink-0">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Proximity Radius</label>
                        <span class="text-xs font-bold font-mono text-cyan-400"><span id="rangeValue">25</span> km</span>
                    </div>
                    <input type="range" id="rangeSlider" min="1" max="40" value="25" class="w-full accent-cyan-500 cursor-pointer">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Hardware Brand Filter</label>
                    <select id="brandFilter" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-cyan-500 font-mono">
                        <option value="ALL">All Manufacturers (Hikvision, Dahua, Axis, Bosch, Uniview, Vivotek)</option>
                        <option value="Hikvision">Hikvision</option>
                        <option value="Dahua">Dahua</option>
                        <option value="Axis">Axis Communications</option>
                        <option value="Uniview">Uniview (UNV)</option>
                        <option value="Vivotek">Vivotek</option>
                        <option value="Bosch">Bosch</option>
                    </select>
                </div>
            </div>

            <!-- Feed Count Header -->
            <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-slate-800 text-xs shrink-0">
                <span class="font-bold uppercase tracking-wider text-slate-400">Discovered Camera Feeds & Credentials</span>
                <span class="text-emerald-400 font-mono">IP Sync Active</span>
            </div>
            
            <!-- Camera Feed Cards List -->
            <div id="cameraList" class="space-y-3 flex-1 overflow-y-auto pr-1">
                <!-- Populated dynamically -->
            </div>
        </aside>

        <!-- Interactive Satellite Map Container -->
        <main class="relative flex-1">
            <div id="map"></div>
        </main>
    </div>

    <!-- Live Stream Modal Video Player -->
    <div id="streamModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[9999] hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-cyan-500 rounded-xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col">
            
            <!-- Modal Header -->
            <div class="bg-slate-800 px-4 py-3 flex justify-between items-center border-b border-slate-700 shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>
                    <h3 id="modalTitle" class="text-sm font-bold text-cyan-400 font-mono">Live Video Stream</h3>
                </div>
                <button onclick="closeStreamModal()" class="text-slate-300 hover:text-white text-xl font-bold px-2">&times;</button>
            </div>
            
            <!-- Active Video Player Screen -->
            <div class="p-2 bg-black relative aspect-video flex items-center justify-center overflow-hidden border-b border-slate-800">
                <div class="absolute inset-0 crt-overlay pointer-events-none z-10"></div>
                
                <!-- Real HTML5 Video Player Element playing a public broadcast stream -->
                <video id="liveVideoElement" class="w-full h-full object-contain" autoplay muted playsinline controls>
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    Your browser does not support video streaming.
                </video>

                <!-- Live HD Badge Overlay -->
                <div class="absolute top-3 left-3 bg-red-600 text-white px-2.5 py-1 rounded text-[10px] font-mono font-bold flex items-center space-x-1.5 shadow z-20">
                    <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span>
                    <span>LIVE DECRYPTED FEED (60 FPS)</span>
                </div>

                <!-- Signal Status Overlay -->
                <div class="absolute top-3 right-3 bg-slate-900/90 border border-slate-700 px-2.5 py-1 rounded text-[10px] text-emerald-400 font-mono font-bold z-20">
                    SIGNAL: 100% STABLE
                </div>
            </div>

            <!-- Modal Footer with Credentials & Specs -->
            <div class="bg-slate-800 px-4 py-3 flex flex-col md:flex-row justify-between items-start md:items-center text-xs font-mono text-slate-200 shrink-0 gap-2">
                <div id="modalSpecs">Brand: Hikvision | Res: 4K UHD | IP: 192.168.1.104</div>
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">Auth: <span class="text-emerald-400 font-bold" id="modalCreds">admin / 12345</span></span>
                    <button onclick="closeStreamModal()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3 py-1 rounded transition shadow">Close Feed</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const centerCoords = [36.3400, 43.1300];
        
        const map = L.map('map', { zoomControl: false }).setView(centerCoords, 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and GIS Community',
            maxZoom: 19
        }).addTo(map);

        L.circleMarker(centerCoords, {
            radius: 9,
            color: '#38bdf8',
            fillColor: '#0ea5e9',
            fillOpacity: 1,
            weight: 2
        }).addTo(map).bindPopup("<b class='text-slate-900'>Orbital Base Reference (You)</b>");

        const brands = ["Hikvision", "Dahua", "Axis", "Uniview", "Vivotek", "Bosch"];
        const types = ["PTZ Dome IP66", "Fixed Bullet IR", "Dome Network Camera", "Motorized Varifocal Bullet", "Outdoor Bullet Pro", "DINION IP Starlight", "Thermal Bi-Spectrum PTZ"];
        const resolutions = ["4K UHD (8MP)", "1080p Full HD", "5MP Q-Series", "4MP Ultra 265", "12MP Fisheye", "1080p 60fps"];
        
        const brandCredentials = {
            "Hikvision": { user: "admin", pass: "admin123" },
            "Dahua": { user: "admin", pass: "admin12345" },
            "Axis": { user: "root", pass: "pass" },
            "Uniview": { user: "admin", pass: "123456" },
            "Vivotek": { user: "root", pass: "root" },
            "Bosch": { user: "service", pass: "admin" }
        };

        const locations = [
            { name: "Al-Nuri Square", baseLat: 36.3445, baseLng: 43.1320 },
            { name: "Mosul University", baseLat: 36.3620, baseLng: 43.1150 },
            { name: "Ninawa Boulevard", baseLat: 36.3320, baseLng: 43.1450 },
            { name: "Al-Jazeera Park", baseLat: 36.3250, baseLng: 43.1200 },
            { name: "Industrial Zone", baseLat: 36.3800, baseLng: 43.1000 },
            { name: "Bab Al-Toub", baseLat: 36.3350, baseLng: 43.1380 },
            { name: "Al-Shurooj", baseLat: 36.3150, baseLng: 43.1550 },
            { name: "Rail Yard Sector", baseLat: 36.3500, baseLng: 43.1050 },
            { name: "Al-Salam Hospital", baseLat: 36.3100, baseLng: 43.1600 },
            { name: "Fifth Bridge East", baseLat: 36.3550, baseLng: 43.1250 },
            { name: "Old City Alley", baseLat: 36.3410, baseLng: 43.1300 },
            { name: "Al-Hadba Minaret", baseLat: 36.3460, baseLng: 43.1310 },
            { name: "Northern Highway", baseLat: 36.4200, baseLng: 43.0800 },
            { name: "Eastern Fuel Depot", baseLat: 36.3300, baseLng: 43.2500 },
            { name: "Southern Gateway", baseLat: 36.2500, baseLng: 43.1100 },
            { name: "Western Interchange", baseLat: 36.3600, baseLng: 42.9800 }
        ];

        let cameras = [];
        let idCounter = 1;

        locations.forEach((loc) => {
            for (let i = 1; i <= 18; i++) {
                const latOffset = (Math.sin(idCounter) * 0.035) + ((i % 3) * 0.004);
                const lngOffset = (Math.cos(idCounter) * 0.035) + ((i % 4) * 0.004);
                const brand = brands[idCounter % brands.length];
                const ip = `192.168.${(idCounter % 50) + 1}.${(idCounter % 250) + 1}`;
                const creds = brandCredentials[brand];
                
                cameras.push({
                    id: idCounter,
                    name: `${loc.name} Node #${i}`,
                    brand: brand,
                    type: types[idCounter % types.length],
                    resolution: resolutions[idCounter % resolutions.length],
                    ip: ip,
                    username: creds.user,
                    password: creds.pass,
                    status: "Online",
                    lat: loc.baseLat + latOffset,
                    lng: loc.baseLng + lngOffset
                });
                idCounter++;
            }
        });

        let markersLayer = L.layerGroup().addTo(map);
        let searchRadiusCircle = null;

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        // Open live video stream modal with specific camera credentials
        function openStreamModal(camName, brand, resolution, ip, user, pass) {
            document.getElementById('modalTitle').innerText = `Live Stream: ${camName}`;
            document.getElementById('modalSpecs').innerText = `Brand: ${brand} | Res: ${resolution} | IP: ${ip}`;
            document.getElementById('modalCreds').innerText = `${user} / ${pass}`;
            
            const videoEl = document.getElementById('liveVideoElement');
            videoEl.currentTime = 0;
            videoEl.play().catch(e => console.log("Autoplay restricted by mobile policy"));
            
            document.getElementById('streamModal').classList.remove('hidden');
        }

        function closeStreamModal() {
            const videoEl = document.getElementById('liveVideoElement');
            videoEl.pause();
            document.getElementById('streamModal').classList.add('hidden');
        }

        function updateDashboard() {
            const maxRange = parseFloat(document.getElementById('rangeSlider').value);
            const selectedBrand = document.getElementById('brandFilter').value;
            
            document.getElementById('rangeValue').innerText = maxRange;

            markersLayer.clearLayers();
            if (searchRadiusCircle) {
                map.removeLayer(searchRadiusCircle);
            }

            searchRadiusCircle = L.circle(centerCoords, {
                radius: maxRange * 1000,
                color: '#38bdf8',
                fillColor: '#38bdf8',
                fillOpacity: 0.08,
                weight: 1.5,
                dashArray: '4, 4'
            }).addTo(map);

            const listContainer = document.getElementById('cameraList');
            listContainer.innerHTML = '';

            let activeCount = 0;

            cameras.forEach(cam => {
                const distance = getDistance(centerCoords[0], centerCoords[1], cam.lat, cam.lng);
                const matchesBrand = (selectedBrand === 'ALL' || cam.brand.toLowerCase() === selectedBrand.toLowerCase());

                if (distance <= maxRange && matchesBrand) {
                    activeCount++;

                    const popupHTML = `
                        <div class="p-2 text-slate-900 min-w-[220px]">
                            <div class="font-bold text-sm mb-1">${cam.name}</div>
                            <div class="text-xs font-semibold text-cyan-700 bg-cyan-50 px-1.5 py-0.5 rounded mb-1">${cam.brand} - ${cam.type}</div>
                            <div class="text-xs text-slate-700 font-mono space-y-0.5 bg-slate-100 p-1.5 rounded mb-2">
                                <div><b>IP:</b> ${cam.ip}</div>
                                <div><b>User:</b> ${cam.username}</div>
                                <div><b>Pass:</b> ${cam.password}</div>
                            </div>
                            <button type="button" onclick="openStreamModal('${cam.name}', '${cam.brand}', '${cam.resolution}', '${cam.ip}', '${cam.username}', '${cam.password}')" class="w-full text-center text-xs bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-1.5 px-3 rounded shadow">
                                View Live Feed &rarr;
                            </button>
                        </div>
                    `;

                    const marker = L.marker([cam.lat, cam.lng]).bindPopup(popupHTML);
                    markersLayer.addLayer(marker);

                    const card = document.createElement('div');
                    card.className = "bg-slate-800/90 border border-slate-700 hover:border-cyan-500/80 p-3 rounded-lg transition group shadow-md cursor-pointer shrink-0";
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-semibold text-slate-100 text-xs group-hover:text-cyan-400 transition">${cam.name}</span>
                            <span class="text-[10px] bg-cyan-950 text-cyan-300 border border-cyan-800 px-1.5 py-0.5 rounded font-mono font-bold">${cam.brand}</span>
                        </div>
                        <div class="text-[11px] space-y-0.5 text-slate-300 font-mono mb-2 bg-slate-900/80 p-2 rounded border border-slate-700/60">
                            <div><span class="text-slate-500">Node IP:</span> <span class="text-cyan-400 font-bold">${cam.ip}</span></div>
                            <div><span class="text-slate-500">Auth Preset:</span> <span class="text-emerald-400">${cam.username}</span> / <span class="text-amber-400">${cam.password}</span></div>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-700/60">
                            <span class="text-[11px] text-slate-400 font-mono">${distance.toFixed(1)} km away</span>
                            <div class="space-x-1">
                                <button type="button" class="map-focus-btn text-[10px] bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-1 rounded transition font-medium">Map</button>
                                <button type="button" class="stream-btn text-[10px] bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-2.5 py-1 rounded transition">View Live Feed &rarr;</button>
                            </div>
                        </div>
                    `;

                    card.querySelector('.map-focus-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        map.setView([cam.lat, cam.lng], 16, { animate: true });
                        marker.openPopup();
                    });

                    card.querySelector('.stream-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        openStreamModal(cam.name, cam.brand, cam.resolution, cam.ip, cam.username, cam.password);
                    });

                    card.addEventListener('click', () => {
                        map.setView([cam.lat, cam.lng], 16, { animate: true });
                        marker.openPopup();
                    });

                    listContainer.appendChild(card);
                }
            });

            document.getElementById('activeCountBadge').innerText = `${activeCount} Nodes`;

            if (activeCount === 0) {
                listContainer.innerHTML = `<div class="text-slate-500 text-xs text-center py-10 font-mono">No nodes detected within current filter parameters. Expand search range.</div>`;
            }
        }

        document.getElementById('rangeSlider').addEventListener('input', updateDashboard);
        document.getElementById('brandFilter').addEventListener('change', updateDashboard);

        updateDashboard();

        window.addEventListener('load', () => { map.invalidateSize(); });
        setTimeout(() => { map.invalidateSize(); }, 300);
        setTimeout(() => { map.invalidateSize(); }, 1000);
    </script>
</body>
</html>
